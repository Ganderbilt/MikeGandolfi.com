<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | Mike Gandolfi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#dcece8; --ink:#1e3532; --ink-soft:#4c645f;
    --coral:#e0592e; --teal:#1f7a70; --rule:rgba(30,53,50,0.13); --max:760px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Work Sans',system-ui,sans-serif; font-size:16px; line-height:1.5; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:3.5rem 1.5rem 5rem; }
  .back{ display:inline-block; color:var(--ink-soft); text-decoration:none; font-size:0.9rem; margin-bottom:2.5rem; }
  .back:hover{ color:var(--coral); }
  h1{ font-family:'Fraunces',serif; font-weight:700; font-size:clamp(2rem,6vw,2.6rem); margin:0 0 2.5rem; }
  h2{ font-family:'Fraunces',serif; font-style:italic; font-weight:600; color:var(--teal); font-size:1.1rem; margin:0 0 1.25rem; padding-bottom:0.6rem; border-bottom:1px solid var(--rule); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:1.1rem; margin-bottom:3rem; }
  figure{ margin:0; }
  figure img{ width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:10px; box-shadow:0 4px 14px rgba(30,53,50,0.12); display:block; }
  figcaption{ font-size:0.82rem; color:var(--ink-soft); margin-top:0.5rem; text-align:center; }
  figure img{ cursor: zoom-in; }
  .lightbox{
    display:none; position:fixed; inset:0; background:rgba(20,30,28,0.88);
    z-index:50; align-items:center; justify-content:center; padding:2rem; cursor:zoom-out;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,0.4); }
</style>
</head>

<div class="wrap">

<div class="lightbox" id="lightbox"><img id="lightbox-img" src="" alt=""></div>
<script>
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lightbox-img');
  document.querySelectorAll('.grid img').forEach(function(img){
    img.addEventListener('click', function(){
      lbImg.src = this.src.replace('?w=300', '');
      lb.classList.add('open');
    });
  });
  lb.addEventListener('click', function(){ lb.classList.remove('open'); });
</script>
</body>
</html>
